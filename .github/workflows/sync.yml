name: Sync formula with the latest Ferrocast release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump the formula to the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/drumst0ck/ferrocast/releases/latest -q .tag_name)
          url="https://github.com/drumst0ck/ferrocast/archive/refs/tags/${tag}.tar.gz"
          if grep -q "url \"${url}\"" Formula/ferrocast.rb; then
            echo "Already at ${tag}"; exit 0
          fi
          curl -fsSL "$url" -o src.tar.gz
          sha=$(sha256sum src.tar.gz | cut -d' ' -f1)
          sed -i -E "0,/^  url \".*\"/s||  url \"${url}\"|" Formula/ferrocast.rb
          sed -i -E "s/^  sha256 \"[0-9a-f]{64}\"/  sha256 \"${sha}\"/" Formula/ferrocast.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ferrocast.rb
          git commit -m "ferrocast ${tag#v}"
          git push
